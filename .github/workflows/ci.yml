# CI = the release checklist of SPEC §11.6 ("chạy trước mọi release") made
# mechanical, plus the gate suites that fit in minutes (backend/GATES.md):
#
#   backend   gofmt · go vet · go test ./... on real Postgres 17 — unit,
#             cmd/api contract + tenant walk (T4), test/failure (T1),
#             test/observe (T3), test/restore (§11.5 drill, needs pg_dump 17)
#             · govulncheck · the image builds
#   reporter  npm ci · test · npm audit
#   frontend  npm ci · typecheck · unit · build (bundle gate) · npm audit
#
# test/load and test/soak are manual (LOAD_TEST=1 / SOAK_TEST=1): their
# numbers only mean something on a quiet, known machine.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read-only deployment preflight regression tests
        run: |
          bash -n server/atp.sh
          bash server/tests/doctor.sh

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same major as deploy/compose.yml. UTF-8 locale is a hard requirement
        # of the identity resolver (pg_trgm parity test); the image default
        # is en_US.utf8.
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atp_test
        ports: ["5499:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d atp_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5499/atp_test?sslmode=disable
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The patched toolchain go.mod names (govulncheck 21-10); explicit so
          # GOTOOLCHAIN=local below never has to download one.
          go-version: "1.26.10"
          cache-dependency-path: backend/go.sum

      # pg_dump/pg_restore of the server's major, for test/restore. Ubuntu's
      # own postgresql-client is 16 and refuses to dump a 17 server.
      - name: Install PostgreSQL 17 client (restore drill)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./test ./migrations)" || { gofmt -l ./cmd ./internal ./test ./migrations; exit 1; }

      - name: go vet
        run: go vet ./...

      # A real S3-compatible server (§14.3 "S3/R2 timeout khi upload"): the
      # s3 client conformance tests (every verb, signed content type, expiry)
      # and test/failure TestObjectStoreHangKeepsRunValid run against it.
      # Test-only credentials from test/s3/seaweedfs.json.
      - name: Start SeaweedFS (S3)
        run: |
          docker run -d --name s3 -p 8333:8333 -v "$PWD/test/s3/seaweedfs.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -dir=/data -volume.max=50 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && break; sleep 1; done

      # Everything Postgres-backed runs for real here: unit stores, the
      # cmd/api contract and cross-tenant walk, test/failure (kills the real
      # binaries), test/observe, test/restore (RESTORE_TEST=1 → a missing
      # pg_dump fails instead of skipping).
      - name: go test (real Postgres, real S3)
        env:
          RESTORE_TEST: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:8333
          S3_TEST_ACCESS_KEY: atptestkey
          S3_TEST_SECRET_KEY: atptestsecret123
        run: go test -count=1 -timeout 15m ./...

      # Pinned and built with the toolchain go.mod names (GOTOOLCHAIN=local);
      # v1.8+ needs Go 1.26, so it moved off v1.1.4 with go1.26.9. Bump with
      # the toolchain.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: docker build (deploy/Dockerfile)
        run: docker build -f deploy/Dockerfile -t atp/backend:ci .

      - name: compose config
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yml --env-file deploy/.env config --quiet

      - name: promtool check (alert rules parse and reference the config)
        run: docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml

      - name: openapi lint (§11.6 API9 — deploy/openapi.yaml is the public surface; parity with the router is a Go test)
        run: npx --yes @redocly/cli@1.34.3 lint deploy/openapi.yaml

  reporter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reporter/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reporter/playwright/package-lock.json
      - run: npm ci
      - run: npm test
      # §14.3 "Reporter mất mạng toàn bộ" on the real `playwright test`: a
      # closed port and a server that never answers — same exit code, every
      # event spooled, delay bounded by flushTimeoutMs (≈ 75 s).
      - name: outage on the real binary
        env:
          ATP_OUTAGE_TEST: "1"
        run: node --test dist/test/outage.test.js
      - name: npm audit (§11.6 dependency review, dev deps included)
        run: npm audit --audit-level=low

  # URL checker (QĐ-14): the guard and real Chromium against a local fixture
  # site (the SSRF refusals are part of it), then the image compose builds.
  checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: checker/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
      - name: npm audit (§11.6 dependency review)
        run: npm audit --audit-level=low
      - name: docker build
        run: docker build -t atp/checker:ci .

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - name: build (typecheck + bundle gate)
        run: npm run build
      - name: npm audit (§11.6 dependency review, dev deps included)
        run: npm audit --audit-level=low

  # GATES.md T0 layer 3 on every push: the compose stack (Postgres, migrate,
  # api, worker, Caddy TLS serving the Vue build), a tenant made with the
  # admin container, a real Playwright run pushed through the npm reporter
  # over https, then the real UI driven through Caddy with no mocks.
  # APP_ENV=dev + OBJSTORE=memory because CI has no bucket, its presigned URLs
  # through Caddy's /_objstore; everything else is the staging shape.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend, reporter, server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the dashboard Caddy will serve
        working-directory: frontend
        run: npm ci && npm run build
      # What server/atp.sh up does before compose (QĐ-14): the reporter tarball
      # Caddy serves at /downloads/. Without it the CI tokens page's
      # /downloads/index.json is a 404 that the live check counts as a console
      # error.
      - name: Pack the reporter Caddy serves at /downloads/
        working-directory: reporter/playwright
        run: |
          npm ci
          npm run build
          mkdir -p ../../backend/deploy/downloads
          node scripts/pack-for-server.mjs ../../backend/deploy/downloads
      - name: Stack up
        working-directory: backend
        run: |
          cp deploy/.env.example deploy/.env
          # OBJSTORE_ENDPOINT: the memory bucket's presigned URLs, reachable
          # from this runner only through Caddy (.env.example has an R2 placeholder).
          sed -i 's/^APP_ENV=.*/APP_ENV=dev/; s/^OBJSTORE=.*/OBJSTORE=memory/; s#^OBJSTORE_ENDPOINT=.*#OBJSTORE_ENDPOINT=https://localhost/_objstore#; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password-0123456789abcdef/; s/^TOKEN_PEPPER=.*/TOKEN_PEPPER=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef/' deploy/.env
          docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
          curl -sk --retry 40 --retry-delay 3 --retry-all-errors https://localhost/healthz
          docker compose -f deploy/compose.yml --env-file deploy/.env ps
      - name: Tenant, member and ingest token via the admin container
        working-directory: backend
        run: |
          C="docker compose -f deploy/compose.yml --env-file deploy/.env run --rm -T admin"
          jid() { grep -o "\"$1\": *\"[^\"]*\"" | head -1 | sed 's/.*: *"\(.*\)"/\1/'; }
          ORG=$($C org create -name Acme -slug acme | jid ID)
          WS=$($C ws create -org "$ORG" -name Payments | jid ID)
          PROJ=$($C project create -ws "$WS" -name checkout | jid ID)
          USER_ID=$($C user create -email alice@example.com -password 'correct horse battery staple' -verified | jid ID)
          # maintainer: every member right plus project.configure, so the live
          # check exercises the JUnit upload, not only its absence.
          $C role grant -user "$USER_ID" -level project -scope "$PROJ" -role maintainer >/dev/null
          TOK=$($C token issue -project "$PROJ" -name ci | jid Plaintext)
          test -n "$PROJ" && test -n "$TOK"
          echo "::add-mask::$TOK"
          echo "ATP_TOKEN=$TOK" >> "$GITHUB_ENV"
      - name: Reporter pushes a real Playwright run through Caddy
        working-directory: reporter/playwright
        env:
          ATP_URL: https://localhost
          NODE_TLS_REJECT_UNAUTHORIZED: "0" # Caddy's internal CA on localhost
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # The example suite fails on purpose, so its exit code is not the
          # check; the reporter's lines are: both runs finished on the platform
          # with their artifacts, nothing given up.
          npm run example 2>&1 | tee example.log | tail -3
          npm run example 2>&1 | tee -a example.log | tail -1
          if grep -E "gave up on the platform|upload failed|could not finish" example.log; then exit 1; fi
          test "$(grep -cE '^\[atp-reporter\] run [0-9a-f-]+: [a-z]+, .*artifacts [1-9][0-9]* ok' example.log)" -eq 2
          sleep 65 # the worker links artifacts to attempts on its minute sweep
      - name: Live check — the real UI against the real api, no mocks
        working-directory: frontend
        env:
          ATP_UI: https://localhost
          ATP_EMAIL: alice@example.com
          ATP_PASSWORD: correct horse battery staple
          ATP_BROWSER_CHANNEL: bundled
        run: |
          node scripts/live-check.mjs ../reporter/playwright/node_modules/playwright
          node scripts/live-manual-history.mjs
          node scripts/live-case-bulk.mjs
          node scripts/live-specialized-results.mjs
      - name: Logs on failure
        if: failure()
        working-directory: backend
        run: docker compose -f deploy/compose.yml --env-file deploy/.env logs --tail=200 api worker caddy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check-screenshots
          path: |
            frontend/test-results/live-*.png
            frontend/test-results/manual-*.png
            frontend/test-results/case-context-*.png
            frontend/test-results/case-bulk-*.png
            frontend/test-results/specialized-*.png
          if-no-files-found: ignore
      - name: Stack down
        if: always()
        working-directory: backend
        run: docker compose -f deploy/compose.yml --env-file deploy/.env down -v
