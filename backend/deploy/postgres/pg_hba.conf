# Postgres client authentication for deploy/compose.yml (§11.5 "TLS mọi
# nơi"). Read through `-c hba_file=` so the image's default — which lets any
# host in with a password over plaintext — never applies.
#
# TYPE    DATABASE  USER  ADDRESS  METHOD
# Inside the container only (the image's init scripts, pg_isready): the
# Unix socket, which nothing outside the container can reach.
local     all       all            trust
# Every network client: TLS, then a SCRAM password. The clients also check
# the server (sslmode=verify-full against the pgtls CA).
hostssl   all       all   all      scram-sha-256
# Plaintext over the network is refused by name, not by falling off the end.
hostnossl all       all   all      reject
