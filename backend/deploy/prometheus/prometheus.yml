# Scrape config for deploy/compose.yml: both binaries expose /metrics on
# port 9090 inside the compose network only (never published to the host —
# per-project labels are internal data, §6.4/§11.5). alerts.yml is the
# §6.4 rule set; test/observe proves each rule's metric moves.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: atp-api
    static_configs:
      - targets: ["api:9090"]
  - job_name: atp-worker
    static_configs:
      - targets: ["worker:9090"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
