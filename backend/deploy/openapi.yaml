                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Run" } } }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/runs/{runId}:
    get:
      operationId: getRun
      tags: [dashboard]
      summary: One run
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/RunId" }
      responses:
        "200":
          description: The run.
          content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/runs/{runId}/results:
    get:
      operationId: listResults
      tags: [dashboard]
      summary: Results of a run, failures first
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/TestResult" } } }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/results/{resultId}:
    get:
      operationId: getResult
      tags: [dashboard]
      summary: Failure detail — attempts, their artifacts, triage events
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ResultId" }
      responses:
        "200":
          description: The detail.
          content: { application/json: { schema: { $ref: "#/components/schemas/ResultDetail" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/results/{resultId}/triage-events:
    post:
      operationId: recordTriageEvent
      tags: [dashboard]
      summary: Record a triage event (§8.3)
      description: |
        Actor and time are the session's and the server's; anything the body
        claims about them is ignored (§11.6 API3). `FAILURE_SEEN` is deduped per
        user/result/24 h (`200` instead of `201`). Viewers get `403`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ResultId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [FAILURE_SEEN, MARKED_FLAKY, MARKED_KNOWN_ISSUE, RESOLVED] }
                payload: { type: object }
      responses:
        "201":
          description: Recorded.
          content: { application/json: { schema: { $ref: "#/components/schemas/TriageEvent" } } }
        "200":
          description: Deduplicated (`FAILURE_SEEN` already recorded in the window).
          content: { application/json: { schema: { $ref: "#/components/schemas/TriageEvent" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/artifacts/{artifactId}/content:
    get:
      operationId: getArtifactContent
      tags: [dashboard]
      summary: Bytes of a verified artifact (§11.5 serving policy)
      description: |
        `Content-Disposition: inline` only for `image/png|webp|jpeg`,
        `video/webm|mp4` and `text/plain`; `attachment` for everything else.
        Always `X-Content-Type-Options: nosniff`, `Cache-Control: private,
        no-store`, sandboxing CSP. Unverified, expired or foreign ids are `404`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ArtifactId" }
      responses:
        "200":
          description: The bytes, with the artifact's declared content type.
          content:
            "*/*": { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/StoreUnavailable" }
  /v1/projects/{projectId}/identities:
    get:
      operationId: listIdentities
      tags: [dashboard]
      summary: Test identities (§9), optionally only flaky ones
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: view, in: query, schema: { type: string, enum: [flaky] }, description: Server-side filter on the flaky verdict. }
      responses:
        "200":
          description: A page of identities.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Identity" } } }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/identities/{identityId}:
    get:
      operationId: getIdentity
      tags: [dashboard]
      summary: One identity
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdentityId" }
      responses:
        "200":
          description: The identity.
          content: { application/json: { schema: { $ref: "#/components/schemas/Identity" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/identities/{identityId}/runs:
    get:
      operationId: listIdentityRuns
      tags: [dashboard]
      summary: Runs in which this identity was seen, newest first
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdentityId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of runs.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Run" } } }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/metrics/triage:
    get:
      operationId: getTriageMetrics
      tags: [dashboard]
      summary: Triage coverage and TTRC over a window (§6.4 product signals; EM screen is P1.5)
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        "200":
          description: The window's numbers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  failures: { type: integer }
                  triaged: { type: integer }
                  seen: { type: integer }
                  untriagedRate: { type: number }
                  triageCoverage: { type: number }
                  ttrcMedianSeconds: { type: [number, "null"] }
                  timeToFirstViewSeconds: { type: [number, "null"] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/metrics/trend:
    get:
      operationId: getCategoryTrend
      tags: [dashboard]
      summary: Failure category counts per week (§8.7)
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: days, in: query, schema: { type: integer, default: 90 } }
      responses:
        "200":
          description: Weekly buckets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        week: { type: string, format: date-time, description: "Start of the week (Monday 00:00), UTC." }
                        category: { type: string, enum: [app_bug, test_bug, flaky_timing, env_infra, env_data, dependency_external, unknown], description: "§8.7; `unknown` = not triaged yet." }
                        count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- identity operations (§9.4 manual tools) -------------------------------
  /v1/projects/{projectId}/review:
    get:
      operationId: listReviewQueue
      tags: [dashboard]
      summary: Pending review pairs (§9.3 step 4 — a rename the resolver would not decide alone), oldest first
      description: Needs triage rights. At most 100; a queue past 50 is already an alert (§6.4), not a paging problem.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: The pending pairs.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/ReviewItem" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/review/{itemId}:
    post:
      operationId: decideReview
      tags: [dashboard]
      summary: Record the human verdict on a pair
      description: |
        `merged` folds the identity created at resolve time into the candidate
        (same as merge, audited as `review`); `kept` leaves them separate. Needs
        `identity.merge` (admin). The actor recorded is the session user.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [merged, kept] }
      responses:
        "200":
          description: Decided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [merged, kept] }
                  decidedBy: { type: string }
                  decidedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`CONFLICT` — already decided."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/projects/{projectId}/identities/{identityId}/aliases:
    get:
      operationId: listIdentityAliases
      tags: [dashboard]
      summary: "The identity's fingerprints — in force (validTo null) and historical"
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdentityId" }
      responses:
        "200":
          description: Aliases, oldest first.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Alias" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/identities/{identityId}/merge:
    post:
      operationId: mergeIdentity
      tags: [dashboard]
      summary: Fold this identity into another (a rename the resolver missed)
      description: Every alias moves and history unifies; the audit row remembers exactly what moved so undo-merge can put it back. Admin only.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdentityId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into]
              properties:
                into: { type: string, format: uuid, description: The surviving identity. }
      responses:
        "200":
          description: Merged.
          content: { application/json: { schema: { type: object, properties: { mergedInto: { type: string, format: uuid } } } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`CONFLICT` — source or target is not active (already merged or retired)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/projects/{projectId}/identities/{identityId}/undo-merge:
    post:
      operationId: undoMergeIdentity
      tags: [dashboard]
      summary: Put a merged identity back exactly as it was (N43 — this is not a split)
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdentityId" }
      responses:
        "200":
          description: Restored.
          content: { application/json: { schema: { type: object, properties: { restored: { type: string, format: uuid } } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`CONFLICT` — the identity is not merged, or its merge audit is missing."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/projects/{projectId}/identities/{identityId}/split:
    post:
      operationId: splitIdentity
      tags: [dashboard]
      summary: "Split at a time: the alias closes at `at`, a new identity owns the fingerprint from then on"
      description: History before `at` stays with the old identity (which retires once it has no fingerprint left in force). The fingerprint must be an alias of the identity in the path. Admin only.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdentityId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint, at]
              properties:
                fingerprint: { type: string }
                at: { type: string, format: date-time }
      responses:
        "201":
          description: Split; the new identity owns the fingerprint from `at`.
          content: { application/json: { schema: { type: object, properties: { newIdentityId: { type: string, format: uuid } } } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Test Management Plane (§6.8, P2, QĐ-12) ------------------------------
  /v1/projects/{projectId}/suites:
    get:
      operationId: listSuites
      tags: [testmgmt]
      summary: Test suites of the project with their case counts
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Suites, by name.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Suite" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createSuite
      tags: [testmgmt]
      summary: Create a suite (optionally under a parent of the same project)
      description: Needs `testmgmt.write` (member).
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                parentId: { type: string, format: uuid }
      responses:
        "201":
          description: Created.
          content: { application/json: { schema: { $ref: "#/components/schemas/Suite" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/projects/{projectId}/requirements:
    get:
      operationId: listRequirements
      tags: [testmgmt]
      summary: Requirements with how many test cases cover each
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Requirements, p0 first.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Requirement" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createRequirement
      tags: [testmgmt]
      summary: Create a requirement
      description: "`externalKey` (JIRA-123, a Linear id) is unique per project when given. Needs `testmgmt.write`."
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
                externalKey: { type: string, maxLength: 100 }
                priority: { $ref: "#/components/schemas/Priority" }
      responses:
        "201":
          description: Created.
          content: { application/json: { schema: { $ref: "#/components/schemas/Requirement" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/projects/{projectId}/requirements/{requirementId}:
    patch:
      operationId: updateRequirement
      tags: [testmgmt]
      summary: Change title, priority or status
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/RequirementId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
                priority: { $ref: "#/components/schemas/Priority" }
                status: { type: string, enum: [draft, active, done, dropped] }
      responses:
        "200":
          description: Updated.
          content: { application/json: { schema: { $ref: "#/components/schemas/Requirement" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/test-cases:
    get:
      operationId: listTestCases
      tags: [testmgmt]
      summary: Test cases, filterable by suite, automation status, criticality and text
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: suite, in: query, schema: { type: string, format: uuid } }
        - { name: automation, in: query, schema: { $ref: "#/components/schemas/AutomationStatus" } }
        - { name: critical, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: q, in: query, schema: { type: string }, description: "Substring of title or external key." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Cases, priority then age. Lists carry no links or requirements; fetch one for those.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/TestCase" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createTestCase
      tags: [testmgmt]
      summary: Create a manual test case
      description: Steps and expectations are stored and rendered as text (QĐ-9 #3). Needs `testmgmt.write`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestCaseInput" }
      responses:
        "201":
          description: "Created, `automationStatus: manual_only`."
          content: { application/json: { schema: { $ref: "#/components/schemas/TestCase" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/projects/{projectId}/test-cases/import:
    post:
      operationId: importTestCases
      tags: [testmgmt]
      summary: Import test cases from a CSV sheet (§6.8.5, the first and only built-in importer)
      description: |
        Upsert by `key` (external key) or, without one, by exact title. Header
        names are case-insensitive: `key, title, suite, steps, expected,
        priority, critical, requirement`. Steps: one per line or `|`-separated,
        `action => expected`. Unknown suites and requirements are created.
        Body is `text/csv`, or JSON `{csv}` for clients that cannot post raw
        text. ≤ 8 MiB, ≤ 5 000 rows. Rows with a bad priority are reported in
        `errors` and skipped; the rest commit. Needs `testmgmt.write`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          text/csv: { schema: { type: string } }
          application/json:
            schema:
              type: object
              required: [csv]
              properties: { csv: { type: string } }
      responses:
        "200":
          description: What the import did.
          content: { application/json: { schema: { $ref: "#/components/schemas/ImportReport" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: "`PAYLOAD_TOO_LARGE` — the sheet is over 8 MiB."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/projects/{projectId}/imports/junit:
    post:
      operationId: uploadJUnit
      tags: [ingest]
      summary: Upload one JUnit XML report from the dashboard as a historic run (§6.8.5, QĐ-13)
      description: |
        The same import as `POST /v1/imports/junit`, for a person: needs
        `project.configure` (maintainer and up) — writing run history is
        configuring the project; a member triages runs, never makes them.
        Maps each `<testcase>` to one result: `file` (or classname with dots as
        slashes) is the file, classname beyond the file the describes, a
        trailing `[...]` in the name the parameters; `<failure>`/`<error>` →
        failed (timed_out when it names a timeout), `<skipped>` → skipped;
        Surefire `<flakyFailure>` → earlier failed attempts of a flaky pass,
        `<rerunFailure>` → more failed attempts. Times come from the
        testsuite timestamp (UTC when zoneless) plus case durations.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: environment, in: query, schema: { type: string, default: ci }, description: "Environment key (a slug); created if new." }
        - { name: framework, in: query, schema: { type: string, default: junit }, description: "Identity namespace: junit, pytest, jest… Keep one per suite so its history stays one set of tests." }
        - { name: branch, in: query, schema: { type: string } }
        - { name: commit, in: query, schema: { type: string, maxLength: 64 } }
        - { name: startedAt, in: query, schema: { type: string, format: date-time }, description: "Required only when no testsuite has a timestamp — history must not be dated today." }
        - { name: localRunId, in: query, schema: { type: string, format: uuid }, description: "Default: derived from the report and the environment, so importing the same file again is the same run." }
      requestBody:
        required: true
        content:
          application/xml: { schema: { type: string, description: "A JUnit XML report: <testsuites> or <testsuite>, ≤ 20 MiB." } }
      responses:
        "201":
          description: A new historic run, finished; its tier-2 resolve is queued.
          content: { application/json: { schema: { $ref: "#/components/schemas/JUnitImportResult" } } }
        "200":
          description: "This report was imported before (same localRunId): nothing added, `created: false`."
          content: { application/json: { schema: { $ref: "#/components/schemas/JUnitImportResult" } } }
        "400":
          description: "`INVALID_JUNIT` — not a JUnit report, no date, a nameless testcase (the message says where); `INVALID_PAYLOAD` — a bad option."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`RUN_CONFLICT` — the localRunId is a run a reporter created; an import never adds to it."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413":
          description: "`REPORT_TOO_LARGE` — over 20 MiB; split the report by suite."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "415":
          description: "`UNSUPPORTED_MEDIA_TYPE` — send application/xml."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/projects/{projectId}/roi:
    get:
      operationId: getROI
      tags: [testmgmt]
      summary: ROI for one calendar month, in hours (§6.8.3, QĐ-13)
      description: |
        Measured from TriageEvent and attempts, never estimated. Rule 1:
        `triageCoverage` and `untriagedRate` always come with it. Rule 2:
        hours only — money is the reader's rate, applied client-side. Rule 3:
        `savedHours` is null (and `baseline` null) until a measured §5.4
        baseline exists — the screen says "not enough data". savedHours = Σ
        (baseline median − TTRC) over triaged failures, negative when slower.
        flakyHours = CI time of attempts that failed before a flaky pass, plus
        markedFlaky × the baseline's investigation time when it was measured.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: month, in: query, schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }, description: "YYYY-MM (UTC); default the current month; not in the future." }
      responses:
        "200":
          description: The month's ROI.
          content: { application/json: { schema: { $ref: "#/components/schemas/ROI" } } }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/roi/baselines:
    get:
      operationId: listTTRCBaselines
      tags: [testmgmt]
      summary: Measured TTRC baselines, newest first (§5.4)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Append-only history; the newest prospective applies, else the newest retrospective.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TTRCBaseline" } }
                  nextCursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addTTRCBaseline
      tags: [testmgmt]
      summary: Record a measured TTRC baseline (§5.4) — needs project.configure
      description: A correction is a new row; nothing is edited or deleted. The session user is recorded as enteredBy.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, failures, medianMinutes, periodFrom, periodTo]
              properties:
                kind: { type: string, enum: [retrospective, prospective] }
                failures: { type: integer, minimum: 1 }
                medianMinutes: { type: number, minimum: 1 }
                p90Minutes: { type: number, description: "≥ medianMinutes" }
                rerunPassRate: { type: number, minimum: 0, maximum: 1 }
                flakyInvestigationMinutes: { type: number, minimum: 0 }
                periodFrom: { type: string, format: date }
                periodTo: { type: string, format: date, description: "Not in the future: a baseline is measured." }
                note: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Recorded.
          content: { application/json: { schema: { $ref: "#/components/schemas/TTRCBaseline" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/test-cases/{testCaseId}:
    get:
      operationId: getTestCase
      tags: [testmgmt]
      summary: One test case with its automation links and covered requirements
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/TestCaseId" }
      responses:
        "200":
          description: The case.
          content: { application/json: { schema: { $ref: "#/components/schemas/TestCase" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTestCase
      tags: [testmgmt]
      summary: Change any field of a test case
      description: "Absent fields keep their value; `suiteId: \"\"` or `ownerId: \"\"` clears. Needs `testmgmt.write`."
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/TestCaseId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestCaseInput" }
      responses:
        "200":
          description: Updated.
          content: { application/json: { schema: { $ref: "#/components/schemas/TestCase" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/test-cases/{testCaseId}/links:
    post:
      operationId: linkTestCaseAutomation
      tags: [testmgmt]
      summary: "Tie the case to a TestIdentity — the link that makes the plane worth building (§6.8.1)"
      description: |
        `stableTestId` must be an **active** identity of the same project:
        a merged or retired one is `409 CONFLICT`, one of another project is
        `404`. The case becomes `automated` on its first link. Never a run,
        a result or a clientTestId. Needs `testmgmt.write`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/TestCaseId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stableTestId]
              properties:
                stableTestId: { type: string, format: uuid }
                linkType: { type: string, enum: [exact, partial, superset], default: exact }
      responses:
        "201":
          description: Linked.
          content: { application/json: { schema: { $ref: "#/components/schemas/AutomationLink" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/projects/{projectId}/test-cases/{testCaseId}/links/{linkId}:
    delete:
      operationId: unlinkTestCaseAutomation
      tags: [testmgmt]
      summary: Remove an automation link
      description: A case left with no link goes back to `automation_candidate`. Needs `testmgmt.write`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/TestCaseId" }
        - { name: linkId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/test-cases/{testCaseId}/requirements/{requirementId}:
    post:
      operationId: coverRequirement
      tags: [testmgmt]
      summary: Mark the case as covering the requirement (idempotent)
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/TestCaseId" }
        - { $ref: "#/components/parameters/RequirementId" }
      responses:
        "204": { description: Covered. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: uncoverRequirement
      tags: [testmgmt]
      summary: Remove the coverage link
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/TestCaseId" }
        - { $ref: "#/components/parameters/RequirementId" }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/test-plans:
    get:
      operationId: listTestPlans
      tags: [testmgmt]
      summary: Test plans, newest first
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Plans without their executions.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/TestPlan" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createTestPlan
      tags: [testmgmt]
      summary: Create a plan (a round of manual testing)
      description: Manual execution is not a Run (§6.8.6); it lives in plans. Needs `testmgmt.write`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                environmentId: { type: string, format: uuid }
      responses:
        "201":
          description: Created as `draft`.
          content: { application/json: { schema: { $ref: "#/components/schemas/TestPlan" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/test-plans/{planId}:
    get:
      operationId: getTestPlan
      tags: [testmgmt]
      summary: One plan with the latest verdict per test case
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/PlanId" }
      responses:
        "200":
          description: The plan.
          content: { application/json: { schema: { $ref: "#/components/schemas/TestPlan" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateTestPlan
      tags: [testmgmt]
      summary: Change the plan status
      description: A `closed` plan refuses new executions. Needs `testmgmt.write`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/PlanId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [draft, active, closed] }
      responses:
        "200":
          description: Updated.
          content: { application/json: { schema: { $ref: "#/components/schemas/TestPlan" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/test-plans/{planId}/executions:
    post:
      operationId: recordManualExecution
      tags: [testmgmt]
      summary: Record one manual run of one case (append-only; the latest row per case is the verdict)
      description: The executor is the session user. A `draft` plan becomes `active`. Needs `testmgmt.write`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/PlanId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testCaseId, status]
              properties:
                testCaseId: { type: string, format: uuid }
                status: { type: string, enum: [passed, failed, blocked, skipped] }
                note: { type: string, maxLength: 4000 }
                executedAt: { type: string, format: date-time, description: Defaults to now. }
      responses:
        "201":
          description: Recorded.
          content: { application/json: { schema: { $ref: "#/components/schemas/ManualExecution" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/projects/{projectId}/test-plans/{planId}/executions/{executionId}/evidence:
    post:
      operationId: attachManualEvidence
      tags: [testmgmt]
      summary: Attach a file to a manual execution (an Artifact of kind manual_evidence, §6.8.2)
      description: |
        `multipart/form-data` with one `file` part. The api stores the bytes
        itself (no presigned URL): the browser's `Content-Type` of the part
        must be one of `image/png|webp|jpeg`, `video/webm|mp4`,
        `application/pdf`, `text/plain` **and** agree with what the bytes
        sniff as (§11.5) — an HTML file renamed `.png` is `400`. Cap 20 MiB
        (§10.4, `[ASSUMPTION]`). Read the bytes back through
        `getArtifactContent`. A closed plan refuses (`409`), like recording.
        Needs `testmgmt.write`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/PlanId" }
        - { $ref: "#/components/parameters/ExecutionId" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored and verified.
          content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactRef" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413":
          description: "`ARTIFACT_TOO_LARGE` with `details.kind`, `details.limit`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/StoreUnavailable" }
  /v1/projects/{projectId}/releases:
    get:
      operationId: listReleases
      tags: [testmgmt]
      summary: Releases, newest first, each with its last gate result
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      responses:
        "200":
          description: Releases.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Release" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createRelease
      tags: [testmgmt]
      summary: Open a release the gate will speak about
      description: "`version` is unique per project. `branch` narrows which run the gate judges (newest finished run on that branch); empty means any branch. Needs `testmgmt.write`."
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, minLength: 1, maxLength: 100 }
                branch: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created as `open`, not yet evaluated.
          content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/projects/{projectId}/releases/{releaseId}:
    get:
      operationId: getRelease
      tags: [testmgmt]
      summary: One release with its last gate result and decision
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ReleaseId" }
      responses:
        "200":
          description: The release.
          content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/releases/{releaseId}/evaluate:
    post:
      operationId: evaluateRelease
      tags: [testmgmt]
      summary: Run the §6.8.4 quality gate against the newest finished run and store the result
      description: |
        Five declared rules, each with its own level: `critical_regression`
        (blocked), `untriaged_failures` (blocked), `flaky_rate` > 3 % (warn),
        `p0_coverage` below the previous release (warn), `prod_smoke_approved`
        (not applicable before P3). The verdict folds them — a failed warn
        rule never becomes blocked (#3). Evaluating never changes the release
        status: the gate advises, a named person decides. Needs `testmgmt.write`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ReleaseId" }
      responses:
        "200":
          description: The release with `gate` filled.
          content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/projects/{projectId}/releases/{releaseId}/decision:
    post:
      operationId: decideRelease
      tags: [testmgmt]
      summary: A named person approves, blocks or ships the release — overriding the gate if they choose
      description: "`release.decide` (admin). The gate's verdict is kept beside the decision, so an override is visible as one (#1). `shipped` is terminal."
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/ReleaseId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [blocked, approved, shipped] }
                note: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Decided.
          content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/releases/{releaseId}/gate:
    get:
      operationId: getReleaseGateForCI
      tags: [testmgmt]
      summary: "The release and its gate for CI (§6.8.4 #2): a bearer token with `project:read` on the release's project"
      description: |
        The URL names no project, so the release is looked up first and the
        token authorized against that project; a token of another tenant, an
        ingest-only token, or an unknown id all answer `404`. A deploy job
        polls this and stops on `gate.verdict == "blocked"` unless
        `status` shows a named override.
      security: [{ ingestToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ReleaseId" }
      responses:
        "200":
          description: The release with its last gate result and decision.
          content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    ingestToken:
      type: http
      scheme: bearer
      description: "`atp_ing_` + 256-bit secret, scoped to one project with `project:ingest` only (§8.8, §11.4). Shown once at issue."
    sessionCookie:
      type: apiKey
      in: cookie
      name: atp_session
      description: "Set by `POST /v1/session`; HttpOnly, Secure, SameSite=Lax. The value is opaque and starts with `atp_sess_` — that prefix is not the cookie name."
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: "Value of the readable `atp_csrf` cookie, required on every state-changing browser request together with an allow-listed `Origin`."

  parameters:
    ProtocolVersion:
      name: X-Protocol-Version
      in: header
      required: false
      schema: { type: string, pattern: '^\d+\.\d+$', default: "1.1" }
    LocalRunId:
      name: localRunId
      in: path
      required: true
      description: The reporter's UUID for the run, unique per project.
      schema: { type: string, format: uuid }
    ArtifactId: { name: artifactId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid }, description: "The server's run id, not localRunId." }
    ResultId: { name: resultId, in: path, required: true, schema: { type: string, format: uuid } }
    IdentityId: { name: identityId, in: path, required: true, schema: { type: string, format: uuid } }
    RequirementId: { name: requirementId, in: path, required: true, schema: { type: string, format: uuid } }
    TestCaseId: { name: testCaseId, in: path, required: true, schema: { type: string, format: uuid } }
    PlanId: { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
    ExecutionId: { name: executionId, in: path, required: true, schema: { type: string, format: uuid } }
    ReleaseId: { name: releaseId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string, format: uuid } }
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 }, description: Page size; the server caps at 100 (§7.10). }
    Cursor: { name: cursor, in: query, schema: { type: string }, description: "Opaque; bound to project, filter and sort. `400 INVALID_CURSOR` when reused elsewhere." }

  responses:
    InvalidPayload:
      description: "`INVALID_PAYLOAD` with `details.field` (and `details.index` for a batch); on ingest also `UNSUPPORTED_EVENT_TYPE` (`details.index`, `details.type`) and `INVALID_PROTOCOL_VERSION`."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InvalidCursor:
      description: "`INVALID_CURSOR` | `INVALID_SORT` | `INVALID_QUERY` — a cursor issued for another list, an unsupported sort, or a bad filter; restart from the first page."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: "`UNAUTHENTICATED` — missing, malformed, unknown, expired or revoked credential; one message for all (§11.2)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: "`FORBIDDEN` — authenticated, inside the tenant, but the role (or the token's permissions) does not allow it (§11.3.2); on ingest also `TOKEN_SCOPE` for a token not scoped to exactly one project."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CSRF:
      description: "`CSRF` — token missing/mismatched or Origin not allow-listed."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: "`NOT_FOUND`, `PROJECT_NOT_FOUND`, `RUN_NOT_FOUND`, `RESULT_NOT_FOUND` or `ARTIFACT_NOT_FOUND` — absent, or belonging to another tenant; the two are indistinguishable by design (§11.3.3)."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: "`CONFLICT` — the write contradicts current state: a duplicate key or version, a link to a merged/retired identity, an execution in a closed plan, a decision on a shipped release."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: "`RATE_LIMITED` with `Retry-After` seconds (§7.4)."
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UpgradeRequired:
      description: "`UPGRADE_REQUIRED` — protocol older than N−1 (§6.5); `details.supported` lists majors."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    StoreUnavailable:
      description: "`STORE_UNAVAILABLE` — object store timed out; retry."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AuthUnavailable:
      description: "`AUTH_UNAVAILABLE` — the database behind authentication did not answer; retry. Any authenticated route can answer this."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    TTRCBaseline:
      type: object
      required: [id, kind, failures, medianMinutes, p90Minutes, rerunPassRate, flakyInvestigationMinutes, periodFrom, periodTo, note, enteredBy, enteredAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [retrospective, prospective] }
        failures: { type: integer }
        medianMinutes: { type: number }
        p90Minutes: { type: [number, "null"] }
        rerunPassRate: { type: [number, "null"] }
        flakyInvestigationMinutes: { type: [number, "null"] }
        periodFrom: { type: string, format: date }
        periodTo: { type: string, format: date }
        note: { type: string }
        enteredBy: { type: string }
        enteredAt: { type: string, format: date-time }
    ROI:
      type: object
      required: [month, from, to, failures, triaged, triageCoverage, untriagedRate, ttrcMedianMinutes, baseline, savedHours, flakyHours, flakyRetryHours, markedFlaky, investigationCounted, fewTriaged, minTriaged]
      properties:
        month: { type: string, example: "2026-09" }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        failures: { type: integer }
        triaged: { type: integer }
        triageCoverage: { type: number }
        untriagedRate: { type: number }
        ttrcMedianMinutes: { type: [number, "null"] }
        baseline: { oneOf: [{ $ref: "#/components/schemas/TTRCBaseline" }, { type: "null" }] }
        savedHours: { type: [number, "null"], description: "null: no measured baseline — not enough data." }
        flakyHours: { type: number }
        flakyRetryHours: { type: number }
        markedFlaky: { type: integer }
        investigationCounted: { type: boolean }
        fewTriaged: { type: boolean, description: "Fewer than minTriaged triaged failures: shown, with a warning." }
        minTriaged: { type: integer }
    JUnitImportResult:
      type: object
      required: [runId, localRunId, created, tests, attempts, duplicates, status, flakyCount, startedAt, finishedAt]
      properties:
        runId: { type: string, format: uuid }
        localRunId: { type: string, format: uuid }
        created: { type: boolean, description: "false: this report was imported before." }
        tests: { type: integer, description: "Testcases in the report." }
        attempts: { type: integer, description: "Attempts stored now (0 on a re-import)." }
        duplicates: { type: integer, description: "Attempts already stored by an earlier import." }
        status: { type: string, enum: [passed, failed, error, cancelled, running, queued] }
        flakyCount: { type: integer }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
    Page:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array }
        nextCursor: { type: [string, "null"] }

    # ingest
    CreateRun:
      type: object
      required: [localRunId, environmentKey, startedAt]
      properties:
        localRunId: { type: string, format: uuid }
        environmentKey: { type: string, description: Created on first use inside the project. }
        trigger:
          type: object
          properties:
            type: { type: string }
            provider: { type: string }
            ref: { type: string }
            commitSha: { type: string }
            ciRunUrl: { type: string, description: "Stored and rendered as a link, never fetched (§7.10)." }
        framework: { type: object, properties: { name: { type: string }, version: { type: string } } }
        reporter: { type: object, properties: { name: { type: string }, version: { type: string }, protocolVersion: { type: string } } }
        startedAt: { type: string, format: date-time }
    RunOpened:
      type: object
      required: [runId, limits]
      properties:
        runId: { type: string, format: uuid }
        limits:
          type: object
          properties:
            maxEventsPerBatch: { type: integer, const: 500 }
            maxBatchBytes: { type: integer, const: 5242880 }
            artifactBytes: { type: object, additionalProperties: { type: integer }, description: Cap per kind (§10.4). }
        identityMap: { type: object, additionalProperties: { type: string } }
    Event:
      type: object
      required: [sequence, type, clientTestId, identity, status, outcome]
      properties:
        sequence: { type: integer, minimum: 1, description: Unique within the run; the idempotency key with localRunId. }
        type: { type: string, const: test.finished }
        clientTestId: { type: string, maxLength: 256 }
        occurrenceIndex: { type: integer, minimum: 0 }
        attempt: { type: integer, minimum: 0 }
        identity:
          type: object
          required: [framework, filePath, titlePath]
          properties:
            framework: { type: string }
            filePath: { type: string }
            titlePath: { type: array, items: { type: string } }
            paramSignature: { type: string }
        status: { type: string, enum: [passed, failed, skipped, timed_out, interrupted] }
        outcome: { type: string, enum: [expected, unexpected, flaky, skipped], description: "The framework's verdict, carried as-is (N36/N41)." }
        durationMs: { type: integer }
        error:
          type: object
          properties:
            message: { type: string }
            stack: { type: string }
            snippet: { type: string }
        workerId: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    EventBatch:
      type: object
      required: [events]
      properties:
        events: { type: array, minItems: 1, maxItems: 500, items: { $ref: "#/components/schemas/Event" } }
    BatchAccepted:
      type: object
      required: [accepted, duplicates]
      properties:
        accepted: { type: integer }
        duplicates: { type: integer }
        identityMap: { type: object, additionalProperties: { type: string }, description: "clientTestId → stableTestId for tests resolved inline." }
    RunFinished:
      type: object
      required: [runId, status]
      properties:
        runId: { type: string, format: uuid }
        status: { type: string, enum: [passed, failed] }
        flakyCount: { type: integer }
        finishedAt: { type: string, format: date-time }

    # artifacts
    ArtifactKind:
      type: string
      enum: [screenshot, video, trace, har, log, attachment, manual_evidence]
      description: "`manual_evidence` (§6.8.2) is never declared by a reporter; it enters only through `attachManualEvidence`."
    DeclareArtifact:
      type: object
      required: [localRunId, clientTestId, attempt, name, kind, contentType, sizeBytes, sha256]
      properties:
        localRunId: { type: string, format: uuid }
        clientTestId: { type: string }
        occurrenceIndex: { type: integer, minimum: 0 }
        attempt: { type: integer, minimum: 0, description: Required on every artifact (§7.7). }
        name: { type: string, maxLength: 200 }
        kind: { $ref: "#/components/schemas/ArtifactKind" }
        contentType: { type: string, description: Must be allowed for the kind; HTML/SVG never are. }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    ArtifactDeclared:
      type: object
      required: [artifactId, status, expiresAt, limits, linked]
      properties:
        artifactId: { type: string, format: uuid }
        status: { type: string, enum: [pending, uploaded, verified] }
        expiresAt: { type: string, format: date-time, description: "Retention, fixed at declare (§8.4, §10.4)." }
        limits: { type: object, additionalProperties: { type: integer } }
        linked: { type: boolean }
        upload:
          type: object
          description: Single PUT (< 8 MB). Send `headers` verbatim — they are signed.
          properties:
            method: { type: string, const: PUT }
            url: { type: string, format: uri }
            headers: { type: object, additionalProperties: { type: string } }
            expiresAt: { type: string, format: date-time }
        multipart:
          type: object
          description: Chunked path (≥ 8 MB). `parts` lists only what is still missing.
          properties:
            uploadId: { type: string }
            partSize: { type: integer }
            maxParallel: { type: integer }
            parts: { type: array, items: { type: object, properties: { number: { type: integer }, url: { type: string, format: uri } } } }
            received: { type: array, items: { type: integer } }
            expiresAt: { type: string, format: date-time }
    CompleteArtifact:
      type: object
      properties:
        sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: Must equal the declared one. }
        parts: { type: array, items: { type: object, required: [partNumber, etag], properties: { partNumber: { type: integer }, etag: { type: string } } } }
    ArtifactCompleted:
      type: object
      required: [artifactId, status, sizeBytes, linked, expiresAt]
      properties:
        artifactId: { type: string, format: uuid }
        status: { type: string, const: verified }
        sizeBytes: { type: integer }
        linked: { type: boolean, description: False until the attempt's event has arrived; the worker links within a minute. }
        expiresAt: { type: string, format: date-time }

    # session
    Session:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            mfa:
              type: object
              description: "`required` — an org owner (§11.2); while `required && !enabled` every route but the session and MFA ones answers `403 MFA_ENROLLMENT_REQUIRED`."
              properties:
                enabled: { type: boolean }
                required: { type: boolean }
        csrfToken: { type: string }
        invitations: { type: boolean, description: "Mail is on (MAIL=smtp): adding an email with no account to a team invites it." }
        passwordReset: { type: boolean, description: "Forgot-password by email is available (MAIL=smtp)." }
        providers:
          type: array
          description: "OAuth sign-ins switched on in the api's configuration (§11.2); the sign-in page shows a button for each."
          items: { type: string, enum: [google, github] }

    # dashboard
    Project:
      type: object
      required: [id, name, workspaceName, actions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        workspaceName: { type: string }
        actions:
          type: array
          description: "What the caller may do here per the §11.3.2 matrix, from the roles held on the chain org → workspace → project (six roles, §11.3.1). The UI hides what is absent; every call is still checked server-side (403 when the role is too low)."
          items: { $ref: "#/components/schemas/ProjectAction" }
    ProjectAction:
      type: string
      enum: [view, triage, identity.merge, token.manage, project.configure, project.manage, member.manage, org.manage, data.delete, testmgmt.write, release.decide]
    MemberScope:
      type: object
      required: [level, id, name, organizationName, actions]
      properties:
        level: { type: string, enum: [organization, workspace] }
        id: { type: string, format: uuid }
        name: { type: string }
        organizationName: { type: string }
        actions: { type: array, items: { $ref: "#/components/schemas/ProjectAction" } }
    Invitation:
      type: object
      required: [id, email, role, level, invitedBy, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [org_owner, org_admin, workspace_admin, maintainer, member, viewer] }
        level: { type: string, enum: [organization, workspace, project] }
        invitedBy: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Member:
      type: object
      required: [userId, email, role, level, createdAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, enum: [org_owner, org_admin, workspace_admin, maintainer, member, viewer] }
        level:
          type: string
          enum: [organization, workspace, project]
          description: Where the role is held. A level above the list's own node is inherited and changed there.
        createdAt: { type: string, format: date-time }
    Run:
      type: object
      required: [id, branch, commitSha, status, environmentName, startedAt, durationMs, totalCount, passedCount, failedCount, flakyCount]
      properties:
        id: { type: string, format: uuid }
        branch: { type: string }
        commitSha: { type: string }
        status: { type: string, enum: [queued, running, passed, failed, error, cancelled] }
        environmentName: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        durationMs: { type: [integer, "null"], description: Null while running. }
        totalCount: { type: integer }
        passedCount: { type: integer, description: Excludes flaky passes. }
        failedCount: { type: integer, description: failed + timed_out + interrupted. }
        flakyCount: { type: integer, description: "`passed` with flakyCount > 0 is a warning, never clean green." }
    TestResult:
      type: object
      required: [id, displayName, filePath, finalStatus, attemptCount, durationMs, stableTestId]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, description: Untrusted text from the reporter. }
        filePath: { type: string }
        finalStatus: { type: string }
        attemptCount: { type: integer }
        durationMs: { type: integer }
        stableTestId: { type: [string, "null"], format: uuid, description: Null until the resolver has run. }
        failureObservedAt: { type: [string, "null"], format: date-time }
    ArtifactRef:
      type: object
      required: [id, name, kind, contentType, sizeBytes, expiresAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ArtifactKind" }
        contentType: { type: string }
        sizeBytes: { type: integer }
        expiresAt: { type: string, format: date-time }
    Attempt:
      type: object
      required: [attempt, status, durationMs, error, artifacts]
      properties:
        attempt: { type: integer }
        status: { type: string }
        durationMs: { type: integer }
        error:
          type: [object, "null"]
          properties:
            message: { type: [string, "null"], description: Untrusted; render as text only (§7.10). }
            stack: { type: [string, "null"] }
        artifacts: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ArtifactRef" }, description: Verified uploads linked to this attempt. }
    TriageEvent:
      type: object
      required: [id, type, actorName, occurredAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        actorName: { type: string }
        occurredAt: { type: string, format: date-time }
    ResultDetail:
      type: object
      required: [result, runId, attempts, events]
      properties:
        result: { $ref: "#/components/schemas/TestResult" }
        runId: { type: string, format: uuid }
        attempts: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/Attempt" } }
        events: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/TriageEvent" } }
    IdentityRef:
      type: object
      required: [id, canonicalTitle, canonicalFilePath, status]
      properties:
        id: { type: string, format: uuid }
        canonicalTitle: { type: string, description: "Title path joined with ' › '; empty when the identity is gone." }
        canonicalFilePath: { type: string }
        status: { type: string, enum: [active, merged, retired, ""] }
    ReviewItem:
      type: object
      required: [id, createdAt, identity, candidate, fingerprint, score, gap, runId]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        identity:
          allOf: [{ $ref: "#/components/schemas/IdentityRef" }]
          description: Created at resolve time.
        candidate:
          allOf: [{ $ref: "#/components/schemas/IdentityRef" }]
          description: The suggested rename source.
        fingerprint: { type: string }
        score: { type: number, description: "Best match score, 0–1 (§9.3)." }
        runnerUpId: { type: string, description: Empty when there was no second candidate. }
        runnerUpScore: { type: number }
        gap: { type: number, description: "score − runnerUpScore; a small gap is why a human is asked." }
        breakdown: { type: object, additionalProperties: { type: number } }
        runId: { type: string, format: uuid }
    Alias:
      type: object
      required: [id, fingerprint, source, matchScore, validFrom, validTo]
      properties:
        id: { type: string, format: uuid }
        fingerprint: { type: string }
        source: { type: string, description: "How the alias came to be (initial, auto_match, manual merge, split, …)." }
        matchScore: { type: number }
        createdBy: { type: string }
        validFrom: { type: string, format: date-time }
        validTo: { type: [string, "null"], format: date-time, description: Null while in force. }
    Identity:
      type: object
      required: [id, canonicalTitle, canonicalFilePath, verdict, flakyScore, totalRuns, recentStatuses, status, mergedIntoId]
      properties:
        id: { type: string, format: uuid }
        canonicalTitle: { type: string }
        canonicalFilePath: { type: string }
        verdict: { type: string, description: "Worst signal across environments; `insufficient_data` below two runs (§8.6)." }
        flakyScore: { type: [number, "null"] }
        totalRuns: { type: integer }
        recentStatuses: { type: array, maxItems: 30, items: { type: string }, description: Newest first. }
        status: { type: string, enum: [active, merged, retired], description: "§9.4 operations change it; merged and retired identities keep their history and stay readable by id but leave the active list." }
        mergedIntoId: { type: [string, "null"], format: uuid, description: The survivor while merged; the UI offers undo and links to it. }
    # ---- Test Management Plane (§6.8) ------------------------------------------
    Priority: { type: string, enum: [p0, p1, p2, p3], default: p2 }
    AutomationStatus: { type: string, enum: [manual_only, automation_candidate, automated, obsolete] }
    Suite:
      type: object
      required: [id, parentId, name, cases, createdAt]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, description: Empty at the root. }
        name: { type: string }
        cases: { type: integer }
        createdAt: { type: string, format: date-time }
    Requirement:
      type: object
      required: [id, externalKey, title, priority, status, coveredBy, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        externalKey: { type: string, description: "JIRA-123, Linear id; empty when none." }
        title: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        status: { type: string, enum: [draft, active, done, dropped] }
        coveredBy: { type: integer, description: Test cases linked through coverage. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Step:
      type: object
      required: [action, expected]
      properties:
        action: { type: string, maxLength: 2000 }
        expected: { type: string, maxLength: 2000 }
    TestCaseInput:
      type: object
      description: Create requires `title`; on PATCH every field is optional and absent means unchanged.
      properties:
        suiteId: { type: string, description: A suite of the same project; empty clears. }
        externalKey: { type: string, maxLength: 100, description: Create only; the import upsert key. }
        title: { type: string, minLength: 1, maxLength: 500 }
        steps: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Step" } }
        expected: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        isCritical: { type: boolean, description: Feeds the release gate's regression rule (§6.8.4). }
        automationStatus: { $ref: "#/components/schemas/AutomationStatus" }
        ownerId: { type: string, description: A user id; empty clears. }
    AutomationLink:
      type: object
      required: [id, testCaseId, stableTestId, linkType, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        testCaseId: { type: string, format: uuid }
        stableTestId: { type: string, format: uuid, description: "TestIdentity.id — never a run, result or clientTestId (§6.8.1)." }
        linkType: { type: string, enum: [exact, partial, superset] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    TestCase:
      type: object
      required: [id, suiteId, suiteName, externalKey, title, steps, expected, priority, isCritical, automationStatus, ownerId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        suiteId: { type: string }
        suiteName: { type: string }
        externalKey: { type: string }
        title: { type: string }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
        expected: { type: string }
        priority: { $ref: "#/components/schemas/Priority" }
        isCritical: { type: boolean }
        automationStatus: { $ref: "#/components/schemas/AutomationStatus" }
        ownerId: { type: string }
        links: { type: array, items: { $ref: "#/components/schemas/AutomationLink" }, description: "Present on a single case, absent in lists." }
        requirements: { type: array, items: { type: string, format: uuid }, description: "Requirement ids this case covers; present on a single case." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ImportReport:
      type: object
      required: [created, updated, skipped, suites, requirements, errors]
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer, description: Rows without a title. }
        suites: { type: integer, description: Suites created on the way. }
        requirements: { type: integer, description: Requirements created from the `requirement` column. }
        errors: { type: array, items: { type: string }, description: "`row N: …` for rows that were skipped for a bad value." }
    ManualExecution:
      type: object
      required: [id, planId, testCaseId, caseTitle, executedBy, status, note, executedAt, evidence]
      properties:
        id: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        testCaseId: { type: string, format: uuid }
        caseTitle: { type: string }
        executedBy: { type: string }
        status: { type: string, enum: [passed, failed, blocked, skipped] }
        note: { type: string }
        executedAt: { type: string, format: date-time }
        evidence: { type: array, items: { $ref: "#/components/schemas/ArtifactRef" }, description: "Verified `manual_evidence` artifacts, oldest first; read each through `getArtifactContent`." }
    TestPlan:
      type: object
      required: [id, name, environmentId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        environmentId: { type: string }
        status: { type: string, enum: [draft, active, closed] }
        executions: { type: array, items: { $ref: "#/components/schemas/ManualExecution" }, description: "Latest row per case; present on a single plan." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GateRule:
      type: object
      required: [id, level, passed, summary, applies]
      properties:
        id: { type: string, enum: [critical_regression, untriaged_failures, flaky_rate, p0_coverage, prod_smoke_approved] }
        level: { type: string, enum: [blocked, warn], description: "Declared per rule (§6.8.4 #3); a failed warn rule never becomes blocked." }
        passed: { type: boolean }
        applies: { type: boolean, description: "False when the rule has no meaning yet (prod smoke before P3) or no data (first release has no previous coverage); such rules are reported, never counted." }
        summary: { type: string }
        details: { type: object, additionalProperties: true }
    GateResult:
      type: object
      required: [verdict, evaluatedAt, rules]
      properties:
        verdict: { type: string, enum: [approved, warn, blocked, no_evidence], description: "`no_evidence` when the project has no finished run to judge." }
        evaluatedAt: { type: string, format: date-time }
        runId: { type: string, format: uuid, description: The judged run. }
        branch: { type: string }
        rules: { type: array, items: { $ref: "#/components/schemas/GateRule" } }
        p0Coverage: { type: number, minimum: 0, maximum: 1, description: "Kept so the next release can compare." }
    Release:
      type: object
      required: [id, version, branch, status, decidedBy, decidedAt, decisionNote, gate, evaluatedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: string }
        branch: { type: string, description: "Empty = newest finished run on any branch." }
        status: { type: string, enum: [open, blocked, approved, shipped], description: "The human decision; independent of `gate.verdict`. An `approved` beside a `blocked` gate is an override, and `decidedBy` names who." }
        decidedBy: { type: string }
        decidedAt: { type: [string, "null"], format: date-time }
        decisionNote: { type: string }
        gate: { oneOf: [{ $ref: "#/components/schemas/GateResult" }, { type: "null" }], description: "Null until evaluated." }
        evaluatedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
