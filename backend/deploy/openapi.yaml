# The public HTTP surface of the platform — SPEC §11.6 API9: "OpenAPI là
# nguồn sự thật; diff mỗi release". Two clients, two credentials:
#
#   reporter  → Bearer atp_ing_… (project:ingest, write-only)  /v1/runs, /v1/artifacts
#   browser   → session cookie + X-CSRF-Token                  /v1/session, /v1/projects/…
#
# Every path×method here is exactly what cmd/api mounts: cmd/api/security_test.go
# fails when this file and the router disagree (same mechanism as routes.txt).
# Response shapes are asserted by cmd/api/api_test.go on a real database and
# by frontend/tests against the same DTOs; frontend/API_CONTRACT.md is the
# prose version of the dashboard half.
openapi: 3.1.0
info:
  title: ATP Report Center API
  version: "1.1"
  description: |
    Protocol version 1.x (§6.5). Reporters send `X-Protocol-Version: 1.1`; a
    server serves N and N−1 and answers `426 UPGRADE_REQUIRED` below that.
    Every error the api itself produces is `{"error":{"code","message","details"}}`
    (a proxy in front may answer differently); every response carries
    `X-Request-Id`. Unexpected failures are `500 INTERNAL` with no detail —
    quote the request id. Any authenticated route may answer `503
    AUTH_UNAVAILABLE` while the database is unreachable. Payloads from reporters are untrusted:
    titles, error messages and stacks are stored and rendered as text only.
servers:
  - url: https://{host}
    variables:
      host: { default: localhost }

tags:
  - name: ingest
    description: Reporter → server. Bearer token scoped to one project. 60 requests/minute/token, burst 120 (`429` + `Retry-After`).
  - name: artifacts
    description: Reporter → server → object store. Three steps — declare, PUT to the presigned URL, complete.
  - name: session
    description: "Browser sign-in. Session cookie `atp_session` (HttpOnly, Secure, SameSite=Lax; its opaque value starts with `atp_sess_`) plus the CSRF double-submit cookie `atp_csrf`, echoed in `X-CSRF-Token` on every state-changing request."
  - name: dashboard
    description: Browser reads and triage writes, always inside one project the session may view. 600 requests/minute/user.
  - name: testmgmt
    description: "Test Management Plane (§6.8, P2): requirements, manual test cases linked to TestIdentity, plans with manual executions, releases with the server-side quality gate. Session for people; the gate is also readable by a project:read token for CI."
  - name: members
    description: "Who can reach a project and with which role (§11.3). Project-level roles are granted and revoked here by holders of `member.manage`; every change is audited."
  - name: ops
    description: Liveness.

security: []

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness (no database round trip)
      responses:
        "200":
          description: The process is serving.
          content:
            application/json:
              schema: { type: object, properties: { status: { const: ok } } }

  # ---- ingest (§7.2–7.4) ---------------------------------------------------
  /v1/runs:
    post:
      operationId: createRun
      tags: [ingest]
      summary: Open a run (idempotent on localRunId within the token's project)
      security: [{ ingestToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ProtocolVersion" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRun" }
      responses:
        "201":
          description: Created.
          content: { application/json: { schema: { $ref: "#/components/schemas/RunOpened" } } }
        "200":
          description: The same localRunId was already opened; same body.
          content: { application/json: { schema: { $ref: "#/components/schemas/RunOpened" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/runs/{localRunId}/events:
    post:
      operationId: appendEvents
      tags: [ingest]
      summary: Append a batch of test events (≤ 500 events, ≤ 5 MB)
      description: |
        Idempotent per `(localRunId, sequence)`: a replayed batch is counted in
        `duplicates`, never stored twice (§7.1). Known tests resolve inline and
        come back in `identityMap`; the rest resolve at finish.
      security: [{ ingestToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/LocalRunId" }
        - { $ref: "#/components/parameters/ProtocolVersion" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventBatch" }
      responses:
        "200":
          description: Accepted.
          content: { application/json: { schema: { $ref: "#/components/schemas/BatchAccepted" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`RUN_FINISHED` — the run no longer accepts events."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413":
          description: "`BATCH_TOO_LARGE` — more than 500 events or 5 MB."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/runs/{localRunId}/finish:
    post:
      operationId: finishRun
      tags: [ingest]
      summary: Close the run (idempotent; queues tier-2 identity resolve)
      security: [{ ingestToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/LocalRunId" }
        - { $ref: "#/components/parameters/ProtocolVersion" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                finishedAt: { type: string, format: date-time }
      responses:
        "200":
          description: Finished (the same body on a repeated call).
          content: { application/json: { schema: { $ref: "#/components/schemas/RunFinished" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---- artifacts (§7.7, §10.4) ------------------------------------------------
  /v1/imports/junit:
    post:
      operationId: importJUnit
      tags: [ingest]
      summary: Backfill one JUnit XML report as a historic run (§6.8.5, QĐ-13)
      description: |
        The report becomes one finished run through the reporter's own
        pipeline (§8.4, tier-1/2 identity, flaky fold, TTRC) — for CI or a
        script importing history file by file. Needs a `project:ingest`
        token scoped to one project; counts toward that token's rate limit.
        Maps each `<testcase>` to one result: `file` (or classname with dots as
        slashes) is the file, classname beyond the file the describes, a
        trailing `[...]` in the name the parameters; `<failure>`/`<error>` →
        failed (timed_out when it names a timeout), `<skipped>` → skipped;
        Surefire `<flakyFailure>` → earlier failed attempts of a flaky pass,
        `<rerunFailure>` → more failed attempts. Times come from the
        testsuite timestamp (UTC when zoneless) plus case durations.
      security: [{ ingestToken: [] }]
      parameters:
        - { name: environment, in: query, schema: { type: string, default: ci }, description: "Environment key (a slug); created if new." }
        - { name: framework, in: query, schema: { type: string, default: junit }, description: "Identity namespace: junit, pytest, jest… Keep one per suite so its history stays one set of tests." }
        - { name: branch, in: query, schema: { type: string } }
        - { name: commit, in: query, schema: { type: string, maxLength: 64 } }
        - { name: startedAt, in: query, schema: { type: string, format: date-time }, description: "Required only when no testsuite has a timestamp — history must not be dated today." }
        - { name: localRunId, in: query, schema: { type: string, format: uuid }, description: "Default: derived from the report and the environment, so importing the same file again is the same run." }
      requestBody:
        required: true
        content:
          application/xml: { schema: { type: string, description: "A JUnit XML report: <testsuites> or <testsuite>, ≤ 20 MiB." } }
      responses:
        "201":
          description: A new historic run, finished; its tier-2 resolve is queued.
          content: { application/json: { schema: { $ref: "#/components/schemas/JUnitImportResult" } } }
        "200":
          description: "This report was imported before (same localRunId): nothing added, `created: false`."
          content: { application/json: { schema: { $ref: "#/components/schemas/JUnitImportResult" } } }
        "400":
          description: "`INVALID_JUNIT` — not a JUnit report, no date, a nameless testcase (the message says where); `INVALID_PAYLOAD` — a bad option."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`RUN_CONFLICT` — the localRunId is a run a reporter created; an import never adds to it."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413":
          description: "`REPORT_TOO_LARGE` — over 20 MiB; split the report by suite."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "415":
          description: "`UNSUPPORTED_MEDIA_TYPE` — send application/xml."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/artifacts:
    post:
      operationId: declareArtifact
      tags: [artifacts]
      summary: Declare an artifact and receive how to upload it
      description: |
        Repeating a declare returns the same artifact with fresh URLs (and, for
        multipart, only the parts still missing). Caps are per kind (§10.4);
        exceeding one is `413` for this artifact only — the run stays valid.
      security: [{ ingestToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeclareArtifact" }
      responses:
        "201":
          description: Declared; upload with `upload` (single PUT) or `multipart`.
          content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactDeclared" } } }
        "200":
          description: Already declared (resume), or already verified (no upload block).
          content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactDeclared" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: "`ARTIFACT_GONE` — expired or deleted; declare under a new name."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413":
          description: "`ARTIFACT_TOO_LARGE` with `details.kind`, `details.limit`, `details.sizeBytes`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/StoreUnavailable" }
  /v1/artifacts/{artifactId}/complete:
    post:
      operationId: completeArtifact
      tags: [artifacts]
      summary: Verify the upload (size, content type, SHA-256) and link it to its attempt
      security: [{ ingestToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ArtifactId" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteArtifact" }
      responses:
        "200":
          description: Verified (or already verified).
          content: { application/json: { schema: { $ref: "#/components/schemas/ArtifactCompleted" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`UPLOAD_INCOMPLETE` — multipart parts missing."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "410":
          description: "`ARTIFACT_GONE`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "`SIZE_MISMATCH` | `CHECKSUM_MISMATCH` | `CONTENT_TYPE_MISMATCH` with `details.expected`/`details.actual`; the object is deleted, declare again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/StoreUnavailable" }

  # ---- session (§11.2) ---------------------------------------------------------
  /v1/session:
    get:
      operationId: getSession
      tags: [session]
      summary: Bootstrap — who am I, and the CSRF token
      description: "Always `200`; anonymous is `user: null`. Sets the CSRF cookie. A stale session cookie is cleared, not a 401."
      responses:
        "200":
          description: Session state.
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
    post:
      operationId: login
      tags: [session]
      summary: Sign in with email and password
      description: "Generic `401` for unknown email, wrong password and unverified email alike; rate limited per IP and per account. Rotates the CSRF token. On an account with MFA on, a correct password opens no session: `202` with a challenge for `POST /v1/session/mfa`."
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in; the session cookie is set.
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "202":
          description: Password correct, second factor required (§11.2). No cookie is set.
          content:
            application/json:
              schema:
                type: object
                required: [mfa, challenge, expiresAt]
                properties:
                  mfa: { type: string, enum: [required] }
                  challenge: { type: string, description: "Opaque, single use, five minutes." }
                  expiresAt: { type: string, format: date-time }
        "400":
          description: "`INVALID_PAYLOAD` (malformed JSON) or `ALREADY_LOGGED_IN` (log out first)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: "`INVALID_CREDENTIALS` — one message for unknown email, wrong password and unverified email (§11.2)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CSRF" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /v1/session/logout:
    post:
      operationId: logout
      tags: [session]
      summary: Revoke the session
      security: [{ sessionCookie: [], csrf: [] }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CSRF" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /v1/session/oauth/{provider}/start:
    get:
      operationId: startOAuth
      tags: [session]
      summary: Sign in with Google or GitHub — send the browser to the provider
      description: |
        A browser navigation, not an XHR. Only providers switched on in the
        api's configuration (`OAUTH_GOOGLE=on`, `OAUTH_GITHUB=on`) work; the
        bootstrap lists them in `providers`. Sets a signed, HttpOnly
        `atp_oauth` cookie (state, PKCE verifier, landing path; ten minutes)
        and redirects to the provider with `code_challenge_method=S256`.
        `redirect` must be a path inside the app; anything else lands on `/`.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github] } }
        - { name: redirect, in: query, schema: { type: string }, description: "Where to land after sign-in, e.g. /p/{id}/runs." }
      responses:
        "302": { description: To the provider's authorize page. }
        "303": { description: "Already signed in: to `redirect`. Provider switched off: to `/sign-in?oauth=disabled`." }
  /v1/session/oauth/{provider}/callback:
    get:
      operationId: oauthCallback
      tags: [session]
      summary: The provider sends the browser back here
      description: |
        Checks the `atp_oauth` cookie and `state`, exchanges `code` with the
        PKCE verifier, and reads who signed in (Google: `sub`, `email`,
        `email_verified`; GitHub: user id and the primary verified email).
        The account is the one linked to that provider subject, or — the
        first time — the verified account with the same verified email, which
        links them (audited `identity.link`). There is no self-signup.
        Answers are redirects: success → `redirect` with the session cookie;
        MFA on → `/sign-in?step=mfa&redirect=…` with the challenge in an
        HttpOnly `atp_mfa` cookie for `POST /v1/session/mfa`; failure →
        `/sign-in?oauth=` `denied` | `state` | `provider` | `no_account` |
        `conflict` | `disabled` | `unavailable`.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, github] } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "303": { description: "Into the app, to the code step, or back to the sign-in page with a reason." }
  /v1/session/identities:
    get:
      operationId: listLinkedIdentities
      tags: [session]
      summary: The Google / GitHub sign-ins linked to the signed-in account
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Oldest first; only the caller's own.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, provider, email, createdAt, lastLoginAt]
                          properties:
                            id: { type: string, format: uuid }
                            provider: { type: string, enum: [google, github] }
                            email: { type: string, description: The provider's address when linked. }
                            createdAt: { type: string, format: date-time }
                            lastLoginAt: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/session/identities/{identityId}:
    delete:
      operationId: unlinkIdentity
      tags: [session]
      summary: Unlink one of the caller's provider sign-ins
      description: Audited as `identity.unlink`. Refused when it is the account's only way to sign in (no password, no other provider).
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { name: identityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Unlinked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CSRF" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`LAST_SIGN_IN` — link another provider first, or ask an admin to set a password."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/invitations/lookup:
    post:
      operationId: lookupInvitation
      tags: [session]
      summary: Who is invited to what — for the accept page
      description: |
        The token comes from the mailed link `/invite#<token>` (a fragment:
        never sent to a server, never in an access log) and travels only in
        this body. Guarded like the login (Origin + double-submit CSRF).
        Unknown tokens count toward the per-IP login limit.
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } }
      responses:
        "200":
          description: An open invitation.
          content:
            application/json:
              schema:
                type: object
                required: [email, role, level, scopeName, invitedBy, expiresAt]
                properties:
                  email: { type: string, format: email }
                  role: { type: string, enum: [org_owner, org_admin, workspace_admin, maintainer, member, viewer] }
                  level: { type: string, enum: [organization, workspace, project] }
                  scopeName: { type: string, description: "e.g. checkout (Payments)" }
                  invitedBy: { type: string }
                  expiresAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/CSRF" }
        "404":
          description: "`INVITATION_NOT_FOUND` — used, withdrawn or older than seven days."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [session]
      summary: Accept — create the account with a password and sign in
      description: |
        Creates the account verified (the mailed link proved the address),
        grants the invited role and opens a session, answering like
        `POST /v1/session`. If the email has an account by now, the role is
        granted and `409 ACCOUNT_EXISTS` asks the person to sign in with it —
        a link never takes an account over.
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        "200":
          description: Signed in.
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "400":
          description: "`INVALID_PASSWORD` (at least 12 characters) or `INVALID_PAYLOAD`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CSRF" }
        "404":
          description: "`INVITATION_NOT_FOUND`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`ACCOUNT_EXISTS` — role granted; sign in."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/session/password/forgot:
    post:
      operationId: forgotPassword
      tags: [session]
      summary: Ask for a password-reset link by email
      description: |
        Always `202` with the same body, whether or not an account uses the
        email (§11.2); the mail leaves in the background so the time taken
        does not tell either. Every request counts toward 5 per 15 minutes per
        email and per IP (`429`). The link is `/reset#<token>` — single use,
        30 minutes, replaced by a newer request. Only with `MAIL=smtp`
        (bootstrap `passwordReset`); otherwise `404 PASSWORD_RESET_OFF`.
        Guarded like the login (Origin + double-submit CSRF).
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } }
      responses:
        "202":
          description: Taken — a link is on its way if an account uses the email.
          content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } }
        "403": { $ref: "#/components/responses/CSRF" }
        "404":
          description: "`PASSWORD_RESET_OFF` — mail is not configured here."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/session/password/reset:
    post:
      operationId: resetPassword
      tags: [session]
      summary: Choose a new password with the mailed token
      description: |
        Sets the password, marks the address verified, revokes every session
        and records `password.reset`. Does not sign in — the next sign-in asks
        for the second factor if MFA is on. Unknown tokens count toward the
        per-IP limit.
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        "204": { description: Password changed; sign in with it. }
        "400":
          description: "`INVALID_PASSWORD` (the token is not spent) or `INVALID_PAYLOAD`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CSRF" }
        "404":
          description: "`RESET_NOT_FOUND` — used, replaced, or older than 30 minutes."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/session/mfa:
    post:
      operationId: completeMfaLogin
      tags: [session]
      summary: Second step of sign-in — trade the challenge and a code for the session
      description: |
        After `POST /v1/session` answered `202`. `code` is the current 6-digit
        TOTP code or one unused recovery code (`xxxxx-xxxxx`, dash and case
        ignored). A code works once; one 30-second step of clock drift either
        way is accepted. Wrong codes count toward the same per-IP and
        per-account limit as passwords. Guarded like the login (Origin +
        double-submit CSRF).
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                challenge: { type: string, description: "From the 202 of POST /v1/session. Omitted after an OAuth sign-in: the challenge is then read from the HttpOnly atp_mfa cookie." }
                code: { type: string }
      responses:
        "200":
          description: Signed in; the session cookie is set.
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "400":
          description: "`INVALID_CODE`, `INVALID_PAYLOAD` or `ALREADY_LOGGED_IN`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: "`MFA_CHALLENGE_EXPIRED` — unknown, used or older than five minutes; sign in again."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403": { $ref: "#/components/responses/CSRF" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    get:
      operationId: getMfaStatus
      tags: [session]
      summary: Two-factor state of the signed-in user
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: "`required` — the user is an org owner (§11.2) and cannot turn MFA off."
          content:
            application/json:
              schema:
                type: object
                required: [enabled, required, recoveryCodesLeft]
                properties:
                  enabled: { type: boolean }
                  required: { type: boolean }
                  recoveryCodesLeft: { type: integer, minimum: 0, maximum: 10 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/session/mfa/setup:
    post:
      operationId: beginMfaSetup
      tags: [session]
      summary: Draw a new TOTP secret (MFA off only)
      description: The secret is stored sealed and stays inactive until `enable` receives a valid code; calling again replaces it.
      security: [{ sessionCookie: [], csrf: [] }]
      responses:
        "200":
          description: Shown once — type the secret into an authenticator app, or open the URI.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUri]
                properties:
                  secret: { type: string, description: "Base32, 32 characters (160 bits)." }
                  otpauthUri: { type: string, description: "otpauth://totp/ATP:<email>?secret=…&issuer=ATP&algorithm=SHA1&digits=6&period=30" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CSRF" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/session/mfa/enable:
    post:
      operationId: enableMfa
      tags: [session]
      summary: Turn MFA on with a first valid code
      description: Returns ten recovery codes, shown once, and revokes every other session of the user. Audited as `mfa.enable`.
      security: [{ sessionCookie: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        "200":
          description: MFA is on.
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes: { type: array, minItems: 10, maxItems: 10, items: { type: string } }
        "400":
          description: "`INVALID_CODE` or `INVALID_PAYLOAD`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CSRF" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/session/mfa/disable:
    post:
      operationId: disableMfa
      tags: [session]
      summary: Turn MFA off with a current code or a recovery code
      description: Refused for org owners (§11.2). Deletes the recovery codes. Audited as `mfa.disable`.
      security: [{ sessionCookie: [], csrf: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        "204": { description: MFA is off. }
        "400":
          description: "`INVALID_CODE` or `INVALID_PAYLOAD`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CSRF" }
        "409":
          description: "`MFA_MANDATORY` — an org owner; or `CONFLICT` — MFA is already off."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---- dashboard (frontend/API_CONTRACT.md) ------------------------------------
  /v1/projects:
    get:
      operationId: listProjects
      tags: [dashboard]
      summary: Projects the session may read
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of projects.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Project" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/projects/{projectId}/members:
    get:
      operationId: listProjectMembers
      tags: [members]
      summary: Everyone who can reach the project, and through which node
      description: |
        Memberships on the chain organization → workspace → project, ordered by
        email then level (organization first); a person with roles at several
        nodes appears once per node. `level` other than `project` is inherited
        and changed at its own level. Needs `member.manage` (§11.3.2 — workspace
        admin, org admin, owner; a maintainer cannot).
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: setProjectMember
      tags: [members]
      summary: Grant a project role to an existing account, or change it
      description: |
        Upsert of the one project-level row for that person; re-posting with
        another role changes it. Only project roles are accepted (§11.3.1 "Gán
        ở tầng"). The account must exist and be verified — there is no invite
        mail yet — so `404 USER_NOT_FOUND` tells the manager the email is not
        in use (accepted enumeration, §11.6 API6). Recorded in `authz_audit`
        as `role.grant` with the replaced role and the session user as actor.
        Needs `member.manage`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [maintainer, member, viewer] }
      responses:
        "200":
          description: The project-level membership as it now stands.
          content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`PROJECT_NOT_FOUND`, or `USER_NOT_FOUND` — no verified account uses that email."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/projects/{projectId}/members/{userId}:
    delete:
      operationId: revokeProjectMember
      tags: [members]
      summary: Remove the person's project-level role
      description: |
        Roles inherited from the workspace or organization are untouched (and
        a person holding only those answers 404 here). Recorded in
        `authz_audit` as `role.revoke`. Needs `member.manage`.
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/member-scopes:
    get:
      operationId: listMemberScopes
      tags: [members]
      summary: Organizations and workspaces whose members the caller manages
      description: |
        The way into the team screens. An org admin or owner gets the
        organization and every workspace in it; a workspace admin gets that
        workspace. Only nodes where `actions` contains `member.manage` are
        listed; `org.manage` in an organization's actions means the caller may
        grant, change and remove owners there. Unpaged: bounded by one tenant.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Organizations first, then workspaces, by name.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/MemberScope" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /v1/workspaces/{workspaceId}/members:
    get:
      operationId: listWorkspaceMembers
      tags: [members]
      summary: Who holds a role on the workspace or its organization
      description: Same shape as the project list; `level` = `organization` rows are inherited. Needs `member.manage` on the workspace.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: setWorkspaceMember
      tags: [members]
      summary: Make an existing account workspace admin
      description: "`role` must be `workspace_admin` (§11.3.1 \"Gán ở tầng\"). Otherwise as the project route: verified account or `404 USER_NOT_FOUND`, audited as `role.grant`."
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [workspace_admin] }
      responses:
        "200":
          description: The workspace-level membership.
          content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`WORKSPACE_NOT_FOUND`, or `USER_NOT_FOUND`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/workspaces/{workspaceId}/members/{userId}:
    delete:
      operationId: revokeWorkspaceMember
      tags: [members]
      summary: Remove the person's workspace-level role
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/WorkspaceId" }
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/organizations/{organizationId}/meter:
    get:
      operationId: getOrgMeter
      tags: [members]
      summary: The §10.6 shadow meter of an organization — counted daily, never charged (QĐ-13)
      description: |
        Org owners only (billing is the owner's, §11.3.1). One row per UTC day
        up to yesterday, summed over the organization's projects: active tests
        (stable ids with a result in 30 days, merged folded into their
        target), raw distinct client fingerprints, identity corrections
        (merge, undo, split, review decisions), runs, results, stored
        artifact bytes. `drift` = |growth(active) − growth(raw)| against
        the previous recorded day; a day above `driftLimit` is flagged.
        `ready` only after `requiredDays` recorded days with no flagged
        one — until then the active-test count is not a billing meter, and
        `reasons` says why.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrganizationId" }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 366, default: 28 } }
      responses:
        "200":
          description: The recorded days, oldest first, and the verdict.
          content:
            application/json:
              schema:
                type: object
                required: [days, ready, reasons, requiredDays, driftLimit]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      required: [day, activeTests, rawFingerprints, corrections, runs, results, artifactBytes, drift, flagged]
                      properties:
                        day: { type: string, format: date }
                        activeTests: { type: integer }
                        rawFingerprints: { type: integer }
                        corrections: { type: integer }
                        runs: { type: integer }
                        results: { type: integer }
                        artifactBytes: { type: integer, format: int64 }
                        drift: { type: number }
                        flagged: { type: boolean }
                  ready: { type: boolean }
                  reasons: { type: array, items: { type: string } }
                  requiredDays: { type: integer, example: 28 }
                  driftLimit: { type: number, example: 0.02 }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/organizations/{organizationId}/members:
    get:
      operationId: listOrganizationMembers
      tags: [members]
      summary: Who holds an organization-level role
      description: Needs `member.manage` on the organization (org admin or owner).
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: A page of members.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } } }
        "400": { $ref: "#/components/responses/InvalidCursor" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: setOrganizationMember
      tags: [members]
      summary: Make an existing account org admin or owner, or change which
      description: |
        Granting `org_owner`, or changing someone who is owner, needs
        `org.manage` — only an owner (`403 OWNER_ONLY`). Demoting the last
        owner is refused (`409 LAST_OWNER`). A new owner is held at MFA
        enrolment on their next request (§11.2).
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrganizationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { type: string, enum: [org_admin, org_owner] }
      responses:
        "200":
          description: The organization-level membership.
          content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } }
        "400": { $ref: "#/components/responses/InvalidPayload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`FORBIDDEN`, `OWNER_ONLY` or `CSRF`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "`ORGANIZATION_NOT_FOUND`, or `USER_NOT_FOUND`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "`LAST_OWNER` — make someone else owner first."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/organizations/{organizationId}/members/{userId}:
    delete:
      operationId: revokeOrganizationMember
      tags: [members]
      summary: Remove the person's organization-level role
      description: Removing an owner needs `org.manage` (`403 OWNER_ONLY`); the last owner cannot be removed (`409 LAST_OWNER`).
      security: [{ sessionCookie: [], csrf: [] }]
      parameters:
        - { $ref: "#/components/parameters/OrganizationId" }
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`FORBIDDEN`, `OWNER_ONLY` or `CSRF`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`LAST_OWNER`."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
